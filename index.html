<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordini Trofeo Ronco 2026</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #1a73e8;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #1a73e8;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #1557b0;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
    .toggle-btn {
      background-color: #5f6368;
      margin-top: 20px;
    }
    .table-container {
      display: none;
      margin-top: 15px;
      overflow-x: auto;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    iframe {
      width: 100%;
      height: 300px;
      border: none;
    }
  </style>
</head>
<body>

  <h1>Ordini Trofeo Ronco 2026</h1>

  <form id="orderForm">
    <div class="form-group">
      <label for="nome">Nome e Cognome:</label>
      <input type="text" id="nome" name="nome" required placeholder="Inserisci il tuo nome">
    </div>

    <div class="form-group">
      <label for="taglia">Taglia:</label>
      <select id="taglia" name="taglia" required>
        <option value="">Seleziona una taglia</option>
        <option value="XS">XS</option>
        <option value="S">S</option>
        <option value="M">M</option>
        <option value="L">L</option>
        <option value="XL">XL</option>
        <option value="XXL">XXL</option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantita">Quantità:</label>
      <input type="number" id="quantita" name="quantita" min="1" value="1" required>
    </div>

    <button type="submit" id="submitBtn">Invia Ordine</button>
  </form>

  <div id="status"></div>

  <!-- Pulsante per mostrare/nascondere la tabella -->
  <button class="toggle-btn" onclick="toggleTable()">Mostra / Nascondi Riepilogo Taglie</button>

  <div class="table-container" id="tableContainer">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vS.../pubhtml?widget=true&amp;headers=false"></iframe>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwoK8P1yHhWqVRt1s-QHCFE5gjEgSk1pPr3d_FVRbpl4DhfV71BW8G-SJdLbgZ8_-Pwhw/exec';
    const form = document.getElementById('orderForm');
    const statusDiv = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.style.color = '#333';
      statusDiv.innerText = 'Invio dell\'ordine in corso...';

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify({
          nome: form.nome.value,
          taglia: form.taglia.value,
          quantita: form.quantita.value
        })
      })
      .then(response => {
        statusDiv.style.color = 'green';
        statusDiv.innerText = 'Ordine inviato con successo!';
        form.reset();
        submitBtn.disabled = false;
      })
      .catch(error => {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Errore durante l\'invio dell\'ordine.';
        console.error('Error!', error.message);
        submitBtn.disabled = false;
      });
    });

    function toggleTable() {
      const container = document.getElementById('tableContainer');
      if (container.style.display === 'block') {
        container.style.display = 'none';
      } else {
        container.style.display = 'block';
      }
    }
  </script>

</body>
</html>
