<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trofeo Ronco 2026 - Ordine Spettatori</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('image_6.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(8px);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; margin-top: 0; color: #f39c12; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input, select { background: #333; color: #fff; }
    button {
      background: #e67e22;
      color: white;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    button:hover { background: #d35400; }
  </style>
</head>
<body>

<div class="container">
  <h1>Trofeo Ronco 2026</h1>
  <p style="text-align:center;">Modulo d'Ordine Spettatori</p>
  
  <form id="orderForm">
    <label for="nome">Nome e Cognome</label>
    <input type="text" id="nome" required placeholder="Inserisci il tuo nome">

    <label for="taglia">Taglia Maglietta</label>
    <select id="taglia" required>
      <option value="">Seleziona una taglia</option>
      <option value="S">S</option>
      <option value="M">M</option>
      <option value="L">L</option>
      <option value="XL">XL</option>
      <option value="XXL">XXL</option>
    </select>

    <label for="quantita">Quantità</label>
    <input type="number" id="quantita" min="1" value="1" required>

    <button type="submit">Conferma Ordine</button>
  </form>
</div>

</body>
</html>
