<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ronco 2026 · Tabellone</title>
<link rel="stylesheet" href="ronco.css">
<style>
  body { background: #0b1220; color: #e2e8f0; overflow: hidden; height: 100vh; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 0 22px; height: 60px; background: linear-gradient(90deg, #0284c7, #0369a1); color: #fff; }
  .top .t1, .top .clock { text-shadow: none; }
  .top .t1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
  .top .t2 { font-size: 12px; opacity: .85; }
  .top .giro { font-size: 22px; font-weight: 800; background: rgba(255,255,255,.18); padding: 6px 16px; border-radius: 999px; }
  .top .nav { display: flex; gap: 6px; }
  .top .nav button { border: 1.5px solid rgba(255,255,255,.55); background: transparent; color: #fff; font-size: 14px; font-weight: 800; padding: 6px 12px; border-radius: 999px; }
  .top .nav button.on { background: #fff; color: #0369a1; border-color: #fff; }
  .top .nav button.lk { opacity: .45; }
  .top .clock { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .main { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 10px 12px; height: calc(100vh - 60px - 42px); }
  .panel { background: #111a2e; border: 1px solid #1e293b; border-radius: 14px; padding: 8px 10px; overflow: hidden; display: flex; flex-direction: column; }
  .panel h2 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: #7dd3fc; }
  .cl { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .cl .r { display: grid; grid-template-columns: 1.6em 2.6em 1fr 4.6em 4.2em 4.4em 2em; font-size: calc(var(--rh, 40px) * .6); align-items: center; gap: 6px; height: var(--rh, 40px); padding: 0 4px; border-bottom: 1px solid #1e293b; font-variant-numeric: tabular-nums; transition: background .6s; }
  .cl .r.h span { font-size: 11px; }
  .cl .r.h { height: 18px !important; color: #64748b; text-transform: uppercase; border: none; padding-bottom: 2px; }
  .cl .pos { font-size: 1.05em; font-weight: 900; text-align: center; }
  .cl .pos.p1 { color: #facc15; } .cl .pos.p2 { color: #cbd5e1; } .cl .pos.p3 { color: #f59e0b; }
  .cl .num { font-size: .72em; color: #7dd3fc; font-weight: 700; text-align: center; background: #0c2a44; border-radius: 6px; padding: 2px 0; }
  .cl .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cl .nm b { font-size: 1em; color: #fff; }
  .cl .nm small { font-size: .68em; color: #94a3b8; margin-left: 8px; font-weight: 500; }
  .cl .dots { letter-spacing: 2px; color: #38bdf8; font-size: .6em; text-align: center; }
  .cl .tot { font-size: 1.02em; font-weight: 800; text-align: right; color: #fff; }
  .cl .gap { font-size: .72em; color: #94a3b8; text-align: right; }
  .cl .pt { font-size: .85em; font-weight: 800; color: #facc15; text-align: center; }
  .cl .sec { font-size: 1.08em; font-weight: 900; text-align: right; color: #fff; }
  .cl .ctot { font-size: .75em; color: #cbd5e1; text-align: right; }
  .cl .cpos { font-size: .72em; color: #7dd3fc; text-align: center; font-weight: 800; }
  .cl .r.wait { opacity: .6; }
  .xg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; }
  .xb { background: #0b1324; border: 1px solid #1e293b; border-radius: 12px; padding: 8px 10px; overflow: hidden; }
  .xb.fin { grid-column: span 2; }
  .xb h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #7dd3fc; }
  .xr { display: grid; grid-template-columns: 1.4em minmax(0,1fr) auto; gap: 8px; align-items: center; font-size: 17px; padding: 5px 2px; border-bottom: 1px solid #1e293b; }
  .xr b, .xr > span:nth-child(2) { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .xr .p { font-weight: 900; color: #facc15; text-align: center; }
  .xr.wait { opacity: .45; font-size: 18px; } .xr .q { font-size: 12px; font-weight: 800; color: #0b1220; background: #facc15; border-radius: 6px; padding: 2px 6px; }
  .xr.dsq { opacity: .45; text-decoration: line-through; }
  .xt { width: 100%; border-collapse: collapse; font-size: 20px; background: transparent; color: #cbd5e1; border-radius: 0; }
  .xt td { background: transparent; }
  .xt td, .xt th { padding: 3px 6px; border-bottom: 1px solid #1e293b; text-align: right; font-variant-numeric: tabular-nums; }
  .xt th { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 600; background: none; }
  .xt td.l, .xt th.l { text-align: left; } .xt td.p { color: #facc15; font-weight: 900; text-align: center; } .xt td.t { color: #fff; font-weight: 900; }
  .cl .lockbar { margin: 0 0 6px; padding: 7px 10px; border-radius: 10px; background: rgba(250,204,21,.12); border: 1.5px solid #ca8a04; color: #facc15; font-weight: 800; font-size: 15px; text-align: center; }
  .cl .lock { margin: 14px 4px 6px; padding: 12px; border: 2px dashed #ca8a04; border-radius: 12px; text-align: center; color: #facc15; font-weight: 900; font-size: 20px; }
  .cl .lock small { font-size: 13px; color: #fde68a; font-weight: 600; }
  .cl .r.wait .sec::after { content: '…'; color: #475569; }
  .cl .r.flash { background: rgba(56,189,248,.28); }
  .cl .r.rit { opacity: .45; }
  .cl .grp { font-size: 11px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; height: 20px; padding: 6px 4px 0; }
  .side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .speaker { flex: 1.5; }
  .bubble { background: #fff; color: #0f172a; border-radius: 16px; padding: 14px 16px; font-size: 21px; font-weight: 700; line-height: 1.3; min-height: 96px; position: relative; animation: pop .5s ease; }
  .bubble .tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; background: #0284c7; color: #fff; border-radius: 6px; padding: 2px 8px; margin-bottom: 6px; }
  .bubble .tag.oro { background: #ca8a04; } .bubble .tag.rosso { background: #dc2626; } .bubble .tag.storia { background: #7c3aed; }
  @keyframes pop { from { transform: scale(.96); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  .feed { margin-top: 10px; overflow: hidden; flex: 1; }
  .feed div { font-size: 14px; color: #cbd5e1; padding: 6px 2px; border-bottom: 1px solid #1e293b; line-height: 1.3; }
  .feed div span { color: #64748b; font-size: 12px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .best { flex: 1; }
  .best .g { display: grid; grid-template-columns: 60px 1fr auto; gap: 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid #1e293b; }
  .best .g .l { font-size: 12px; color: #7dd3fc; font-weight: 800; text-transform: uppercase; }
  .best .g .n { font-size: 17px; font-weight: 700; color: #fff; }
  .best .g .v { font-size: 20px; font-weight: 900; color: #facc15; font-variant-numeric: tabular-nums; }
  .ticker { height: 42px; background: #020617; border-top: 2px solid #0284c7; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
  .ticker .lbl { background: #0284c7; color: #fff; font-weight: 900; padding: 0 16px; height: 100%; display: flex; align-items: center; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; flex-shrink: 0; }
  .ticker .tk { flex: 1; overflow: hidden; height: 100%; display: flex; align-items: center; }
  .ticker .run { display: inline-block; padding-left: 100%; animation: run 120s linear infinite; font-size: 17px; color: #e2e8f0; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  .off { position: fixed; top: 66px; right: 22px; background: #dc2626; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; display: none; }
  @media (max-width: 1150px) { .top .t2 { display: none; } .top .t1 { font-size: 18px; } .top .giro { font-size: 17px; padding: 5px 12px; } .top .nav button { font-size: 12px; padding: 5px 9px; } .top .clock { font-size: 20px; } }
  @media (max-width: 820px) { body { overflow: auto; height: auto; } .main { grid-template-columns: 1fr; height: auto; } .top .t2, .top .clock { display: none; } .cl .r { grid-template-columns: 26px 36px 1fr 64px 56px 0 0; } .cl .ctot, .cl .cpos { display: none; } }
</style>
</head>
<body>
<div class="top">
  <div><div class="t1">Trofeo Ronco 2026</div><div class="t2">7ª edizione · prova a cronometro</div></div>
  <div class="giro" id="giro">Giro 1</div>
  <div class="nav" id="nav"></div>
  <div class="clock" id="clock"></div>
</div>
<div class="off" id="off">Connessione assente</div>

<div class="main">
  <div class="panel">
    <h2 id="clTitle">Classifica provvisoria</h2>
    <div class="cl" id="cl"></div>
  </div>
  <div class="side">
    <div class="panel speaker">
      <h2>🎙️ Lo speaker</h2>
      <div class="bubble" id="bubble"></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="panel best">
      <h2>⚡ Giro più veloce</h2>
      <div id="best"></div>
    </div>
  </div>
</div>
<div class="ticker"><div class="lbl">Ronco story</div><div class="tk"><div class="run" id="run"></div></div></div>

<script src="ronco.js"></script>
<script src="storia.js"></script>
<script>
let pin = R.getPin('tabellone');
let stato = null, visti = null, feed = [], flash = new Set(), ultimoCommento = Date.now();

// nelle liste nome e cognome per intero; i soprannomi li usa solo lo speaker
const pieno = p => p ? p.nome : '';
const pienoN = num => pieno(stato.piloti.find(x => x.num === Number(num)));
const copPiena = n => { const c = (stato.coppie || []).find(x => x.n === n); return c ? pienoN(c.a) + (c.b ? ' – ' + pienoN(c.b) : ' 🏃') : '?'; };
const P = num => stato.piloti.find(p => p.num === Number(num)) || {num, nome: '?', sopr: '?'};
const nome = p => p.sopr || p.nome.split(' ')[0];
const pick = a => a[Math.floor(Math.random() * a.length)];
const ora = () => new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});

// ---------- commenti
// i commenti escono uno ogni 4 secondi; se si accumulano, saltano quelli normali
let codaC = [];
function dici(testo, tipo = '', etichetta = 'Live'){
  codaC.push({testo, tipo, etichetta});
  while (codaC.length > 4) { const i = codaC.findIndex(c => !c.tipo); codaC.splice(i >= 0 ? i : 0, 1); }
  ultimoCommento = Date.now();
}
setInterval(() => { const c = codaC.shift(); if (c) mostra(c.testo, c.tipo, c.etichetta); }, 3500);
function mostra(testo, tipo, etichetta){
  feed.unshift({testo, ora: ora()});
  feed = feed.slice(0, 8);
  const b = document.getElementById('bubble');
  b.innerHTML = `<span class="tag ${tipo}">${etichetta}</span><br>${testo}`;
  b.style.animation = 'none'; b.offsetHeight; b.style.animation = '';
  document.getElementById('feed').innerHTML = feed.slice(1).map(f => `<div><span>${f.ora}</span>${f.testo}</div>`).join('');
  ultimoCommento = Date.now();
}

function commentaTempo(num, g, val, prima){
  const p = P(num), n = nome(p);
  if (val === 'RIT' && R.fuori(stato, p.num, g)) return;
  if (val === 'RIT') return dici(`Ahia! <b>${n}</b> si ferma nel giro ${g}. Un applauso comunque, il Ronco è anche questo.`, 'rosso', 'Ritiro');

  const listaG = R.classificaGiro(stato, g);
  const posG = listaG.findIndex(x => x.p.num === p.num) + 1;
  const primaG = R.classificaGiro(prima, g);
  const exBest = primaG[0];

  // 1. cambio al comando (dal giro 2)
  const cl = R.classifica(stato), clPrima = R.classifica(prima);
  const me = cl.find(r => r.p.num === p.num);
  const leaderPrima = clPrima.find(r => r.pos === 1 && r.giri === g);
  if (g === 2 && me && me.pos === 1 && leaderPrima && leaderPrima.p.num !== p.num) {
    const sec = cl.find(r => r.pos === 2 && r.giri === g);
    const gap = sec ? `, ${R.gap(sec.somma - me.somma).slice(1)} su ${nome(sec.p)}` : '';
    // pretendente vero = era tra i primi 5 dopo il giro precedente
    const primaDi = R.classifica({piloti: stato.piloti, tempi: Object.fromEntries(Object.entries(stato.tempi).map(([k, t]) => [k, t.map((v, i) => i < g - 1 ? v : null)]))});
    const exPos = (primaDi.find(r => r.p.num === p.num) || {}).pos || 99;
    if (exPos <= 5) return dici(`Cambio al comando! <b>${n}</b> passa in testa dopo ${g} giri${gap}. ${pick(['Il gazebo esplode!', 'Che gara!', 'Chi lo ferma?'])}`, 'oro', 'Nuovo leader');
    return dici(`<b>${n}</b> si siede sulla poltrona del leader provvisorio dopo ${g} giri${gap}. Ma i più veloci devono ancora arrivare…`, '', 'Hot seat');
  }
  // 2. giro più veloce
  if (posG === 1 && listaG.length > 1) {
    const frase = exBest ? ` ${nome(exBest.p)} scalzato di ${R.gap(exBest.v - val).slice(1)}.` : '';
    return dici(`Giro ${g} più veloce: <b>${n}</b> in ${R.fmt(val)}!${frase} ${pick(['Che manetta!', 'Chi fa meglio?', 'Applausi al gazebo.', ''])}`, 'oro', 'Giro record');
  }
  // 3. sfida storica: quando arriva il secondo dei due
  for (const [a, b, titolo, prec] of (g === 3 ? [] : STORIA.sfide)) {
    if (p.nome !== a && p.nome !== b) continue;
    const altro = p.nome === a ? b : a;
    const ra = cl.find(r => r.p.num === p.num), rb = cl.find(r => r.p.nome === altro);
    if (!ra || !rb || ra.giri !== g || rb.giri !== g) continue;
    const davanti = ra.somma <= rb.somma ? ra : rb, dietro = davanti === ra ? rb : ra;
    return dici(`${titolo}: dopo ${g} ${g > 1 ? 'giri' : 'giro'} <b>${nome(davanti.p)}</b> davanti a ${nome(dietro.p)} di ${R.gap(dietro.somma - davanti.somma).slice(1)}. Precedenti: ${prec}`, 'storia', 'La sfida');
  }
  // 4. progresso rispetto al giro prima
  const prev = (stato.tempi[p.num] || [])[g - 2];
  if (g > 1 && R.ok(prev)) {
    const d = val - prev;
    if (d <= -2) return dici(`<b>${n}</b> si scalda: ${R.fmt(val)}, ${Math.abs(d).toFixed(2).replace('.', ',')} meglio del giro ${g-1}. ${me && me.pos && g < 3 ? `Ora è ${me.pos}°.` : ''}`, '', 'In crescita');
    if (d >= 6) return dici(`<b>${n}</b> perde ${d.toFixed(2).replace('.', ',')} sul giro ${g-1}… tutto bene nel bosco? ${me && me.pos && g < 3 ? `Resta ${me.pos}°.` : ''}`, 'rosso', 'Occhio');
  }
  // 5. normale, con un pizzico di storia
  const curios = STORIA.piloti[p.nome];
  const extra = curios && Math.random() < 0.6 ? ` <i>${pick(curios)}.</i>` : '';
  dici(`<b>${n}</b> chiude il giro ${g} in ${R.fmt(val)}: ${posG}° nel giro${me && me.pos && g === 2 ? `, ${me.pos}° provvisorio dopo ${g} giri` : ''}.${extra}`);
}

function commentaFineGiro(g){
  const cl = R.classifica(stato);
  const [a, b] = cl.filter(r => r.pos);
  if (g < 3) {
    dici(`Giro ${g} archiviato! Comanda <b>${nome(a.p)}</b>${b ? ` con ${R.gap(b.somma - a.somma).slice(1)} su ${nome(b.p)}` : ''}. ${pick(['Si riparte!', 'Niente è deciso.', 'Tutto aperto.'])}`, 'oro', `Fine giro ${g}`);
  } else {
    dici(`🔒 Crono chiuso! Tutti i tempi sono dentro. La classifica la scopriamo dopo, alla premiazione…`, 'oro', 'Fine crono');
  }
}
function annunciaVincitore(){
  const cl = R.classifica(stato);
  const [a, b] = cl.filter(r => r.pos);
  if (!a) return;
  {
    let storia = '';
    if (a.p.nome === 'Marco Rovero' || a.p.nome === 'Andrea Castellana') storia = ` Quarta vittoria: la bella è di ${nome(a.p)}!`;
    else storia = ` Per la prima volta in sette edizioni non vince né Rover né Caste. Storico!`;
    dici(`🏁 Crono finito! Vince <b>${nome(a.p)}</b> in ${R.fmt(a.somma)}${b ? `, ${R.gap(b.somma - a.somma).slice(1)} su ${nome(b.p)}` : ''}.${storia}`, 'oro', 'Vincitore enduro');
  }
}

// ---------- confronto tra lettura precedente e attuale
function novita(nuovo){
  if (!visti) {   // prima lettura: nessun commento sui tempi già presenti
    visti = JSON.parse(JSON.stringify(nuovo.tempi));
    stato = nuovo;
    const g = Math.min(R.giroInCorso(nuovo), 3);
    const fatti = Object.values(nuovo.tempi || {}).filter(t => t[g - 1] != null).length;
    const pres = nuovo.piloti.filter(p => p.presente && !R.fuori(nuovo, p.num, g)).length;
    if (!Object.values(nuovo.tempi || {}).some(t => t.some(v => v != null)))
      mostra(`Benvenuti al <b>Trofeo Ronco 2026</b>, ${STORIA.edizione}! ${pick(STORIA.curiosita)}`, 'storia', 'Ronco story');
    else if ((nuovo.coppie || []).length) mostra(`Si torna in pista: è il momento del <b>cross a coppie</b>!`, '', 'Live');
    else if (R.giroInCorso(nuovo) > 3) mostra(`🔒 Crono chiuso! La classifica la scopriamo dopo, alla premiazione…`, 'oro', 'Fine crono');
    else mostra(`Giro ${g} in corso: ${fatti} tempi su ${pres}. Si continua!`, '', 'Live');
    return;
  }
  const prima = stato;
  const giroPrima = R.giroInCorso(prima);
  const arrivati = [];
  for (const num in nuovo.tempi) for (let g = 1; g <= 3; g++) {
    const v = nuovo.tempi[num][g - 1], vecchio = (visti[num] || [])[g - 1];
    if (v != null && v !== vecchio) arrivati.push({num: Number(num), g, v});
  }
  // commenta in sequenza: lo stato "prima" cresce un tempo alla volta
  let passo = JSON.parse(JSON.stringify(prima));
  stato = nuovo;
  arrivati.forEach(x => {
    const dopo = JSON.parse(JSON.stringify(passo));
    (dopo.tempi[x.num] = dopo.tempi[x.num] || [null,null,null])[x.g - 1] = x.v;
    const salva = stato; stato = dopo;
    commentaTempo(x.num, x.g, x.v, passo);
    stato = salva; passo = dopo;
    flash.add(x.num);
  });
  const giroOra = R.giroInCorso(nuovo);
  if (giroOra > giroPrima) commentaFineGiro(giroOra - 1);
  const sv = nuovo.svela || {}, svP = prima.svela || {};
  // un evento nuovo (svela, coppie, arrivi) annulla la scelta fatta col tap: si vede subito la novità
  if (nuovo.ultimo !== prima.ultimo || JSON.stringify(sv) !== JSON.stringify(svP) || JSON.stringify(nuovo.arrivi) !== JSON.stringify(prima.arrivi)) scelta = null;
  if (sv.enduro && !svP.enduro && giroOra > 3) annunciaVincitore();
  commentaCross(prima, nuovo);
  visti = JSON.parse(JSON.stringify(nuovo.tempi));
}

// ---------- cosa mostra il tabellone
// Automatico: segue la gara (giro in corso, poi manche, poi l'ultima classifica svelata).
// Con un tap sui pulsanti in alto si guarda un'altra vista per 45 secondi, poi si torna all'automatico.
let scelta = null, sceltaFino = 0;
function scegli(v){ scelta = v; sceltaFino = Date.now() + 45000; disegna(); }
const haTempo = (num, g) => (stato.tempi[num] || [])[g - 1] != null;
const presenti = () => stato.piloti.filter(p => p.presente);
function giroVisto(){   // a giro completo resta su quel giro finché non arriva il primo tempo del successivo
  const g0 = R.giroInCorso(stato);
  const nessuno = g0 > 1 && g0 <= 3 && !presenti().some(p => haTempo(p.num, g0));
  return { g0, g: nessuno ? g0 - 1 : g0, concluso: nessuno };
}
const giro3Partito = () => presenti().some(p => haTempo(p.num, 3));
function opzioni(){
  const sv = stato.svela || {}, o = [], blocco = giro3Partito() && !sv.enduro;
  [1, 2, 3].forEach(g => { if (presenti().some(p => haTempo(p.num, g))) o.push({ k: 'g' + g, t: 'Giro ' + g, lock: blocco && g < 3 }); });
  if (sv.enduro) o.push({ k: 'enduro', t: 'Enduro' });
  if ((stato.coppie || []).length) o.push({ k: 'manche', t: 'Manche' });
  if (sv.cross) o.push({ k: 'cross', t: 'Cross' });
  if (sv.assoluta) o.push({ k: 'assoluta', t: 'Assoluta' });
  return o;
}
function vistaAuto(){
  const sv = stato.svela || {}, u = stato.ultimo || '';
  const cross = (stato.coppie || []).length && R.giroInCorso(stato) > 3;
  if (sv[u] && ['enduro', 'cross', 'assoluta'].includes(u)) return u;
  if (cross) return 'manche';
  return 'live';
}
function vista(){
  if (scelta && Date.now() < sceltaFino && opzioni().some(o => o.k === scelta && !o.lock)) return scelta;
  scelta = null; return vistaAuto();
}

// ---------- disegno
const fl = num => flash.has(num) ? 'flash' : '';
const rkN = num => { const p = stato.piloti.find(x => x.num === Number(num)); return p && p.rnk != null ? `<small>rnk ${p.rnk}</small>` : ''; };
const T = (pos, num, nm, a, b, c, d, cls = '') => `<div class="r ${cls}"><span class="pos p${pos}">${pos || ''}</span><span class="num">${num}</span><span class="nm"><b>${nm}</b>${rkN(num)}</span><span class="sec">${a}</span><span class="gap">${b}</span><span class="ctot">${c}</span><span class="cpos">${d}</span></div>`;
const H = (a, b, c, d) => `<div class="r h"><span>Pos</span><span>N°</span><span>Pilota</span><span style="text-align:right">${a}</span><span style="text-align:right">${b}</span><span style="text-align:right">${c}</span><span>${d}</span></div>`;
const titolo = (stato_, sotto) => { document.getElementById('giro').textContent = stato_; document.getElementById('clTitle').textContent = sotto; };

function disegna(){
  const v = vista();
  document.getElementById('nav').innerHTML = opzioni().map(o =>
    `<button class="${o.k === v || (v === 'live' && o.k === 'g' + giroVisto().g) ? 'on' : ''} ${o.lock ? 'lk' : ''}" ${o.lock ? 'disabled' : `onclick="scegli('${o.k}')"`}>${o.lock ? '🔒 ' : ''}${o.t}</button>`).join('');
  const box = document.getElementById('cl');
  box.style.removeProperty('--rh');
  if (v === 'manche') vManche(box);
  else if (v === 'cross') vClassCross(box);
  else if (v === 'assoluta') vAssoluta(box);
  else if (v === 'enduro') vEnduroFinale(box);
  else if (v[0] === 'g') vGiro(box, +v[1], true);
  else vLive(box);
  setTimeout(() => { flash.clear(); document.querySelectorAll('.r.flash').forEach(e => e.classList.remove('flash')); }, 4000);
  document.getElementById('best').innerHTML = [1,2,3].map(n => {
    const b = R.classificaGiro(stato, n)[0];
    return `<div class="g"><span class="l">Giro ${n}</span><span class="n">${b ? R.esc(pieno(b.p)) : '<span style="color:#475569">–</span>'}</span><span class="v">${b ? R.fmt(b.v) : ''}</span></div>`;
  }).join('');
}

// righe tutte dentro lo schermo
function adatta(box){
  const nRighe = box.querySelectorAll('.r:not(.h)').length, nGrp = box.querySelectorAll('.grp').length, extra = box.querySelector('.lockbar') ? 40 : 0;
  if (innerWidth > 820) box.style.setProperty('--rh', Math.max(26, Math.min(64, Math.floor((box.clientHeight - 20 - nGrp * 20 - extra) / Math.max(nRighe, 1)))) + 'px');
}

// vista automatica durante il crono
function vLive(box){
  const { g, concluso } = giroVisto(), sv = stato.svela || {};
  if (g > 3) {
    if (sv.enduro) return vEnduroFinale(box);
    titolo('🔒 Crono chiuso', 'Giro 3 · tempi del giro');
    return vGiro(box, 3, false, true);
  }
  titolo(concluso ? `✅ Giro ${g} concluso` : `Giro ${g} in corso`, g === 3 ? 'Giro 3 · solo tempi del giro' : 'Classifica provvisoria');
  vGiro(box, g, false);
}

// classifica sul tempo secco del giro gg
function vGiro(box, gg, manuale, chiuso){
  const sv = stato.svela || {}, cl = R.classifica(stato);
  // il totale si vede solo nel giro 2, finché non parte il giro 3 (o dopo «Svela»)
  const mostraTot = (gg === 2 && !giro3Partito()) || (gg >= 2 && sv.enduro);
  if (manuale) titolo(`Giro ${gg}`, `Giro ${gg} · tempi del giro`);
  const giro = R.classificaGiro(stato, gg), best = giro[0];
  const cum = num => { const r = cl.find(x => x.p.num === num) || {}; const t = (stato.tempi[num] || []).slice(0, gg); return { somma: t.filter(R.ok).reduce((a, b) => a + b, 0), r }; };
  let html = (chiuso ? '<div class="lockbar">🔒 Classifica finale e punti alla premiazione</div>' : '') + H(`Giro ${gg}`, 'Distacco', mostraTot ? 'Totale' : '', mostraTot ? 'Cl.' : '');
  if (giro.length) html += `<div class="grp">Classifica del giro ${gg}</div>`;
  // posizione dopo gg giri (solo se il totale è visibile)
  const dopo = giro.map(x => ({ n: x.p.num, s: cum(x.p.num).somma })).sort((a, b) => a.s - b.s);
  giro.forEach((x, i) => {
    const c = cum(x.p.num), pc = dopo.findIndex(d => d.n === x.p.num) + 1;
    html += T(i + 1, x.p.num, R.esc(pieno(x.p)), R.fmt(x.v), i ? R.gap(x.v - best.v) : '', mostraTot ? R.fmt(c.somma) : '', mostraTot ? pc + '°' : '', fl(x.p.num));
  });
  const attesa = cl.filter(r => !r.rit && !haTempo(r.p.num, gg));
  if (attesa.length) {
    const totPrima = gg === 2 && mostraTot;
    html += `<div class="grp">Devono ancora passare${totPrima ? ' · totale dopo 1 giro' : ''}</div>`;
    (totPrima ? attesa : attesa.sort((a, b) => a.p.ordine - b.p.ordine)).forEach(r => {
      html += T('', r.p.num, R.esc(pieno(r.p)), '', '', totPrima && r.giri ? R.fmt(r.somma) : '', totPrima && r.pos ? r.pos + '°' : '', 'wait'); });
  }
  const rit = cl.filter(r => r.rit);
  if (rit.length) { html += `<div class="grp">Ritirati</div>`; rit.forEach(r => { html += T('', r.p.num, R.esc(pieno(r.p)), 'Rit.', '', '', '', 'rit'); }); }
  box.innerHTML = html; adatta(box);
}

function vEnduroFinale(box){
  const cl = R.classifica(stato);
  titolo('🏁 Classifica enduro', 'Classifica enduro');
  let html = H('Totale', 'Distacco', 'Giro 3', 'Pt');
  cl.filter(r => !r.rit && r.giri === 3).forEach(r => { html += T(r.pos, r.p.num, R.esc(pieno(r.p)), R.fmt(r.somma), r.distacco != null ? R.gap(r.distacco) : '', R.fmt(r.t[2]), r.punti ?? '', fl(r.p.num)); });
  const rit = cl.filter(r => r.rit || r.giri < 3);
  if (rit.length) { html += `<div class="grp">Ritirati</div>`; rit.forEach(r => { html += T('', r.p.num, R.esc(pieno(r.p)), 'Rit.', '', '', '', 'rit'); }); }
  box.innerHTML = html; adatta(box);
}

// ---------- CROSS sul tabellone
const sp = n => { const p = stato.piloti.find(x => x.num === n); return p ? nome(p) : n; };
const nomeCop = n => { const c = (stato.coppie || []).find(x => x.n === n); return c ? sp(c.a) + (c.b ? ' – ' + sp(c.b) : ' 🏃') : '?'; };
function vAssoluta(box){
  titolo('🏆 Assoluta', 'Classifica assoluta 2026');
  const fs = Math.max(14, Math.min(22, Math.floor((box.clientHeight - 30) / ((stato.assoluta || []).length + 1) * .55)));
  box.innerHTML = `<table class="xt" style="font-size:${fs}px"><tr><th>Pos</th><th class="l">Pilota</th><th>Enduro</th><th>Cross</th><th>Pen.</th><th>Totale</th></tr>` +
    (stato.assoluta || []).map(r => `<tr><td class="p">${r.pos}</td><td class="l"><b>${R.esc(pienoN(r.num))}</b></td><td>${r.enduro}</td><td>${r.cross}</td><td>${r.pen ? '−' + r.pen : ''}</td><td class="t">${r.tot}</td></tr>`).join('') + '</table>';
}
function vClassCross(box){
  const vc = R.vincitoreCross(stato);
  titolo('🏍️ Classifica cross', vc.regola === 'finale' ? 'Classifica cross · premio al vincitore della finale' : 'Classifica cross · coppie');
  box.innerHTML = `<table class="xt"><tr><th>Pos</th><th class="l">Coppia</th><th>Manche</th><th>Finale</th><th>Punti</th></tr>` +
    (stato.cross || []).map(c => `<tr><td class="p">${c.pos}</td><td class="l"><b>${R.esc(copPiena(c.n))}</b>${c.n === vc.premiata ? ' 🏆' : ''}</td><td>${c.puntiM}</td><td>${c.puntiF ? '+' + c.puntiF : ''}${c.posF === 1 ? ' 🏁' : ''}</td><td class="t">${c.tot}</td></tr>`).join('') + '</table>';
}
function vManche(box){
  titolo('🏍️ Cross a coppie', 'Manche e finale');
  const blocco = (g, tit, coppie, cls = '') => {
    const arr = ((stato.arrivi || {})[g] || []);
    const dentro = new Set(arr.map(a => a.c));
    let pos = 0;
    const righe = arr.map(a => {
      const fuori = g === 'F' && !(stato.qualificati || []).includes(a.c);
      const ok = !a.rit && a.sq !== 'SI' && !fuori, p = ok ? ++pos : '';
      const q = g !== 'F' && ok && p <= 2 ? '<span class="q">FINALE</span>' : '';
      return `<div class="xr ${ok ? '' : 'dsq'}"><span class="p">${p}</span><b>${R.esc(copPiena(a.c))}</b>${q || (a.rit ? '<small>rit.</small>' : '')}</div>`;
    }).join('');
    // coppie ancora da correre: in ordine alfabetico, così non si capisce la classifica enduro
    const attesa = coppie.filter(c => !dentro.has(c.n)).map(c => copPiena(c.n)).sort((a, b) => a.localeCompare(b, 'it'))
      .map(n => `<div class="xr wait"><span></span><span>${R.esc(n)}</span><span></span></div>`).join('');
    return `<div class="xb ${cls}"><h3>${tit}</h3>${righe}${attesa || (righe ? '' : '<div class="xr wait"><span></span><span>in attesa…</span><span></span></div>')}</div>`;
  };
  const cp = stato.coppie || [];
  const fin = (stato.qualificati || []).map(n => cp.find(c => c.n === n)).filter(Boolean);
  box.innerHTML = `<div class="xg">${blocco('M1', 'Manche 1', cp.filter(c => c.manche === 1))}${blocco('M2', 'Manche 2', cp.filter(c => c.manche === 2))}${blocco('F', 'Finale', fin, 'fin')}</div>`;
}

// commenti dello speaker sul cross
function commentaCross(prima, nuovo){
  const stP = stato; stato = nuovo;
  try {
    if (!(prima.coppie || []).length && (nuovo.coppie || []).length)
      dici(`🤝 Coppie pronte, si va al cross! Controllate la vostra manche sul tabellone e preparate maschera e visiera.`, 'oro', 'Cross');
    const A = prima.arrivi || {}, B = nuovo.arrivi || {};
    ['M1', 'M2', 'F'].forEach(g => {
      const a = JSON.stringify(A[g] || []), b = JSON.stringify(B[g] || []);
      if (a === b || !(B[g] || []).length) return;
      const ok = B[g].filter(x => !x.rit && x.sq !== 'SI');
      if (!ok.length) return;
      if (g === 'F') dici(`🏁 Finale: vince <b>${nomeCop(ok[0].c)}</b>!${ok[1] ? ` Secondi ${nomeCop(ok[1].c)}.` : ''} ${pick(['Che spettacolo!', 'Cambio maschera perfetto!', 'Applausi!'])}`, 'oro', 'Finale cross');
      else dici(`${g === 'M1' ? 'Manche 1' : 'Manche 2'}: vince <b>${nomeCop(ok[0].c)}</b>!${ok[1] ? ` In finale anche ${nomeCop(ok[1].c)}.` : ''}`, 'oro', 'Cross');
    });
    const sv = nuovo.svela || {}, svP = prima.svela || {};
    if (sv.cross && !svP.cross && (nuovo.cross || []).length) {
      const vc = R.vincitoreCross(nuovo), cP = nuovo.cross.find(c => c.n === vc.premiata) || nuovo.cross[0];
      let t = vc.regola === 'finale'
        ? `🏍️ Trofeo cross alla coppia che ha vinto la finale: <b>${nomeCop(vc.premiata)}</b>!`
        : `🏍️ Vince il cross la coppia <b>${nomeCop(cP.n)}</b> con ${cP.tot} punti!`;
      if (vc.finale && vc.aPunti && vc.finale !== vc.aPunti)
        t += vc.regola === 'finale' ? ` Più punti per ${nomeCop(vc.aPunti)}.` : ` La finale l'ha vinta ${nomeCop(vc.finale)}.`;
      dici(t, 'oro', 'Cross');
    }
    if (sv.assoluta && !svP.assoluta && (nuovo.assoluta || []).length) {
      const r = nuovo.assoluta[0];
      const nmA = (nuovo.piloti.find(x => x.num === r.num) || {}).nome;
      const bis = {'Riccardo Chiappa': 'Geki fa il bis dopo il 2024!', 'Eric Lavelli': 'Lavelli fa il bis dopo il 2025!', 'Paolo Bernardi': 'Cipol torna a vincere dopo il 2023!'}[nmA]
        || 'Dal 2023, con il cross, l\'assoluta l\'hanno vinta Cipol, Geki e Lavelli: nell\'era del cross è la prima volta per lui!';
      dici(`🏆 Assoluto 2026: <b>${sp(r.num)}</b> con ${r.tot} punti! ${bis}`, 'oro', 'Assoluto');
    }
  } finally { stato = stP; }
}

function ticker(){
  const frasi = STORIA.curiosita.slice();
  Object.entries(STORIA.piloti).forEach(([nm, f]) => { const p = stato.piloti.find(x => x.nome === nm && x.presente); if (p) frasi.push(`${nome(p)}: ${f[0]}`); });
  const run = document.getElementById('run');
  run.textContent = frasi.sort(() => Math.random() - .5).join('   •   ');
  // velocità costante e lenta: circa 45 pixel al secondo, qualunque sia la lunghezza del testo
  requestAnimationFrame(() => { run.style.animationDuration = Math.round(run.offsetWidth / 45) + 's'; });
}

// ---------- ciclo
async function leggi(){
  try {
    const s = await R.leggi(pin);
    document.getElementById('off').style.display = 'none';
    if (!s.ok) { R.setPin('tabellone', ''); location.reload(); return; }
    novita(s); disegna();
  } catch(e) { if (e.message !== 'occupato') document.getElementById('off').style.display = 'block'; }
}
function silenzio(){ // dopo 45" senza tempi, una curiosità
  if (Date.now() - ultimoCommento > 45000) {
    const vivi = stato.piloti.filter(p => p.presente && STORIA.piloti[p.nome]);
    if (Math.random() < .5 && vivi.length) { const p = pick(vivi); dici(`Lo sapevate? <b>${nome(p)}</b>: ${pick(STORIA.piloti[p.nome])}.`, 'storia', 'Ronco story'); }
    else dici(pick(STORIA.curiosita), 'storia', 'Ronco story');
  }
}
setInterval(() => document.getElementById('clock').textContent = new Date().toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}), 1000);

// schermo sempre acceso (se il browser lo permette)
async function svegli(){ try { await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('click', svegli); document.addEventListener('visibilitychange', () => { if (!document.hidden) { svegli(); if (stato) leggi(); } });

function avvia(s){ novita(s); disegna(); ticker(); setInterval(leggi, 5000); setInterval(silenzio, 15000); setInterval(ticker, 300000); svegli(); }
if (pin) R.leggi(pin).then(s => s.ok ? avvia(s) : (R.setPin('tabellone',''), R.chiediPin('tabellone', 'Tabellone', (p, s) => { pin = p; avvia(s); })))
  .catch(() => R.chiediPin('tabellone', 'Tabellone', (p, s) => { pin = p; avvia(s); }));
else R.chiediPin('tabellone', 'Tabellone', (p, s) => { pin = p; avvia(s); });
</script>
